<!DOCTYPE html>
<html>
<head>
<title>WATSON DASHBOARD</title>
<link rel="stylesheet" href="style.css">

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
</head>

<body>

<div class="dash">
    <h1>WATSON-XD CONTROL PANEL</h1>

    <p id="user"></p>

    <button onclick="logout()">Logout</button>

    <div class="card">
        <h3>Bot Status</h3>
        <p>Connected to system backend</p>
    </div>

    <div class="card">
        <h3>Features</h3>
        <ul>
            <li>Group Control</li>
            <li>Anti-Link</li>
            <li>Auto Reply</li>
        </ul>
    </div>
</div>

<script src="firebase-config.js"></script>

<script>
firebase.auth().onAuthStateChanged(user=>{
    if(!user){
        window.location.href="/";
    } else {
        document.getElementById("user").innerText = user.email || user.displayName;
    }
});

function logout(){
    firebase.auth().signOut().then(()=>{
        window.location.href="/";
    });
}
</script>

</body>
</html>
